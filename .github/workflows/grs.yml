name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6
          path: profile/langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Equalize card heights
        run: |
          get_height() {
            grep -o 'height="[0-9]*"' "$1" | head -1 | grep -o '[0-9]*'
          }
          H1=$(get_height profile/stats.svg)
          H2=$(get_height profile/langs.svg)
          if [ "$H1" -gt "$H2" ]; then MAX=$H1; else MAX=$H2; fi
          echo "Stats height: $H1, Langs height: $H2, Using: $MAX"
          sed -i "0,/height=\"[0-9]*\"/s/height=\"[0-9]*\"/height=\"$MAX\"/" profile/stats.svg
          sed -i "0,/height=\"[0-9]*\"/s/height=\"[0-9]*\"/height=\"$MAX\"/" profile/langs.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
